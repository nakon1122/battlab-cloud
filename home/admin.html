<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0f13">
<title>หลังบ้าน BATTLAB</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2213%22%20fill%3D%22%23101820%22%2F%3E%3Cpath%20fill%3D%22%23FFD326%22%20d%3D%22M38%205%2013%2035h16l-4%2024%2026-32H35z%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090c;--card:#11161c;--card2:#0e1318;--line:#232c36;--text:#eef2f5;--muted:#a3afba;--dim:#6f7c88;--y:#ffcf22;--ok:#3ddc84;--bad:#ff6b5a;--warn:#ffb020;--blue:#59c3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 6px)}
.num{font-family:"Chakra Petch",sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
a{color:var(--y)}a.btn{color:var(--text)}
.wrap{max-width:1240px;margin:0 auto;padding:18px clamp(12px,3vw,28px) 60px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:6px 0 16px}
.head h1{margin:0;font:700 26px "Chakra Petch",sans-serif;letter-spacing:.04em}
.head h1 b{color:var(--y)}
.role{padding:4px 10px;border-radius:999px;background:#ffcf2222;color:var(--y);font-size:12px;font-weight:700}
.sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px;background:var(--card2);border:1px solid var(--line);border-radius:18px;margin-bottom:16px}
.tabs button{min-height:44px;padding:8px 16px;border:0;border-radius:13px;background:transparent;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.tabs button[aria-pressed=true]{background:var(--y);color:#151000}
.tabs .cnt{font:600 12px "Chakra Petch";padding:1px 7px;border-radius:99px;background:#ffffff14}
.tabs button[aria-pressed=true] .cnt{background:#0000001f}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{position:relative;overflow:hidden}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font:700 30px "Chakra Petch",sans-serif;margin-top:2px}
.tile .s{font-size:12px;color:var(--dim)}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);transform:translateX(-100%);animation:sheen 4s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1 1 240px;min-height:44px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2)}
.chip{min-height:38px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;font-weight:600}
.chip[aria-pressed=true]{border-color:var(--y);color:var(--y);background:#ffcf2214}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left;transition:border-color .2s,transform .2s}
.row:hover{border-color:#3a4652;transform:translateY(-1px)}
.row .main{flex:1;min-width:0}
.row .t,.row .m{display:block}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:#ffffff0d}
.ic svg{width:22px;height:22px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:1px}
.b-super{background:#ffcf2226;color:var(--y)}.b-support{background:#59c3ff22;color:var(--blue)}.b-ban{background:#ff6b5a26;color:var(--bad)}.b-unc{background:#ffb02026;color:var(--warn)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.sk{height:62px;border-radius:14px;background:linear-gradient(90deg,#11161c,#18202a,#11161c);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* drawer */
.drawer{position:fixed;inset:0;z-index:2147483100;display:flex;justify-content:flex-end;background:#000a;backdrop-filter:blur(4px);animation:fade .2s}
.drawer[hidden]{display:none}
.panel{width:min(520px,100%);height:100%;overflow:auto;background:#0d1217;border-left:1px solid var(--line);padding:20px;animation:slide .28s cubic-bezier(.2,.9,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.panel h2{margin:0;font:700 22px "Chakra Petch",sans-serif;word-break:break-all}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin:14px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-all}
.sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:#16202a;font-weight:600}
.btn:hover{filter:brightness(1.2)}
.btn.y{background:var(--y);border-color:var(--y);color:#151000}
.btn.red{background:transparent;border-color:#ff6b5a88;color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 200px}
.field input,.field select{min-height:44px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text)}
.x{float:right;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483200;padding:12px 18px;border-radius:12px;background:#1b252f;border:1px solid var(--line);box-shadow:0 10px 30px #0008;animation:fade .2s;max-width:90vw}
.toast.err{border-color:var(--bad);color:#ffd4ce}
.gate{max-width:460px;margin:12vh auto;text-align:center}
.note{font-size:12px;color:var(--dim)}
.log .row{cursor:default}
.otaRow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.otaRow input[type=checkbox]{width:22px;height:22px;accent-color:#ffcf22;flex:none}
.otaRow label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#ffffff12;color:var(--muted);white-space:nowrap}
.st.ok{background:#3ddc8422;color:var(--ok)}.st.err{background:#ff6b5a22;color:var(--bad)}.st.run{background:#ffcf2222;color:var(--y)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.confirm{position:fixed;inset:0;z-index:2147483150;display:grid;place-items:center;background:#000b;backdrop-filter:blur(4px)}
.confirm>div{width:min(460px,92vw)}
@media(max-width:640px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}.row .r{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate card" hidden></div>
  <div id="app" hidden>
    <div class="head">
      <h1><b>⚡</b> หลังบ้าน BATTLAB</h1><span class="role" id="who"></span><span class="sp"></span>
      <button class="btn" id="reload" type="button">↻ โหลดใหม่</button>
    </div>
    <nav class="tabs" aria-label="ส่วนของหลังบ้าน">
      <button type="button" data-tab="ov" aria-pressed="true">ภาพรวม</button>
      <button type="button" data-tab="mem" aria-pressed="false">สมาชิก <span class="cnt num" id="cMem">–</span></button>
      <button type="button" data-tab="esp" aria-pressed="false">ESP32 / อุปกรณ์ <span class="cnt num" id="cEsp">–</span></button>
      <button type="button" data-tab="ota" aria-pressed="false">อัปเดตเฟิร์มแวร์</button><button type="button" data-tab="web" aria-pressed="false">เทมเพลตเว็บ</button><button type="button" data-tab="log" aria-pressed="false">บันทึกการแก้ไข</button>
    </nav>
    <main id="view"></main>
  </div>
</div>
<div class="drawer" id="drawer" hidden><div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="dTitle"></div></div>

<script>
/* safety net in old-style JS (runs even where newer syntax fails): if the back office has not
   appeared after 15 s, show why instead of a blank page */
(function () {
  var errs = [];
  window.onerror = function (m, s, l) { errs.push(String(m) + (s ? ' (' + String(s).split('/').pop() + ':' + l + ')' : '')); };
  function h(v) { return String(v).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  setTimeout(function () {
    var app = document.getElementById('app'), g = document.getElementById('gate');
    if (!g || (app && !app.hidden) || !g.hidden) return;
    var why = typeof window.supabase === 'undefined' ? 'โหลดไลบรารีฐานข้อมูล (cdn.jsdelivr.net) ไม่ได้ · ลองเปลี่ยนเน็ต Wi-Fi/4G' : errs.length ? 'เบราว์เซอร์นี้รันหน้าหลังบ้านไม่ได้' : 'หน้าเว็บค้างระหว่างเริ่มต้น';
    g.hidden = false;
    g.innerHTML = '<h2 style="margin-top:0">เปิดหลังบ้านไม่สำเร็จ</h2><p class="note" style="font-size:14px">' + h(why) +
      '<br><small style="word-break:break-all">' + h(errs.join(' | ').slice(0, 400)) + '<br>' + h(navigator.userAgent) + '</small></p>' +
      '<button class="btn y" type="button" onclick="location.reload()">ลองใหม่</button>';
  }, 15000);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
'use strict';
const sb = supabase.createClient('https://zpsxcdzkayqhzbdcdoed.supabase.co','sb_publishable_roXek86Fm64tr_vEG2pYRw_4onX6cBJ',{auth:window.battlabAuthOptions});
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = ts => { if (!ts) return 'ไม่เคย'; const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return 'เมื่อสักครู่'; if (s < 3600) return Math.floor(s/60)+' นาทีที่แล้ว'; if (s < 86400) return Math.floor(s/3600)+' ชม.ที่แล้ว'; return Math.floor(s/86400)+' วันที่แล้ว'; };
const dt = ts => ts ? new Date(ts).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const ERR = {'admin only':'บัญชีนี้ไม่ใช่แอดมิน','super admin only':'ต้องเป็น Super admin','cannot suspend yourself':'ระงับบัญชีตัวเองไม่ได้','cannot delete yourself':'ลบบัญชีตัวเองไม่ได้',
  'remove super admin role first':'ถอดสิทธิ์ Super admin ก่อน','type the e-mail to confirm':'พิมพ์อีเมลให้ตรงเพื่อยืนยัน','no account with that e-mail':'ไม่พบบัญชีอีเมลนี้',

const thErr = e => { const m = e?.message || String(e); for (const k in ERR) if (m.includes(k)) return ERR[k]; return m; };
function toast(msg, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role','status'); t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 3200); }
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw error; return data; }

const KIND = {
  board:   {n:'บอร์ด BATTLAB', c:'#ffcf22', p:'M7 2v4M17 2v4M7 18v4M17 18v4M2 7h4M2 17h4M18 7h4M18 17h4M6 6h12v12H6zM10 10h4v4h-4z'},
  inverter:{n:'อินเวอร์เตอร์', c:'#59c3ff', p:'M4 4h16v16H4zM8 12h8M12 8v8'},
  screen:  {n:'จอ Cloud Screen', c:'#b98cff', p:'M3 5h18v11H3zM8 20h8M12 16v4'},

const icon = k => `<span class="ic" style="color:${KIND[k]?.c||'#fff'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${KIND[k]?.p||''}"></path></svg></span>`;

const S = { tab:'ov', me:null, members:null, esp:null, q:'', memFilter:'all', espKind:'all', espOnline:false };
const isSuper = () => S.me?.role === 'super';

// never leave a blank page: every startup step has a time limit, failures show the reason + retry
const withTimeout = (p, ms, what) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(what + ' ใช้เวลานานเกิน ' + ms / 1000 + ' วินาที')), ms))]);
function failGate(err) {
  if (!$('#app').hidden) return;
  gate('เปิดหลังบ้านไม่สำเร็จ', esc((err && err.message) || err || 'ไม่ทราบสาเหตุ') + '<br>กด "ลองใหม่" · ถ้ายังไม่ได้ ให้ออกจากระบบแล้วเข้าใหม่');
  $('#gate').insertAdjacentHTML('beforeend', '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn y" type="button" id="gRetry">ลองใหม่</button><button class="btn" type="button" id="gOut">ออกจากระบบแล้วเข้าใหม่</button></div>');
  $('#gRetry').onclick = () => location.reload();
  $('#gOut').onclick = async () => { try { await withTimeout(sb.auth.signOut(), 5000, 'ออกจากระบบ'); } catch (e) {} location.href = '/'; };
}
addEventListener('error', e => failGate(e.message));
addEventListener('unhandledrejection', e => failGate(e.reason));
async function boot() {
  let data;
  try { ({ data } = await withTimeout(sb.auth.getSession(), 12000, 'ตรวจการเข้าสู่ระบบ')); } catch (e) { return failGate(e); }
  if (!data || !data.session) return gate('เข้าสู่ระบบก่อน', 'ล็อกอินที่หน้าหลัก BATTLAB ด้วยบัญชีแอดมิน แล้วกลับมาหน้านี้', true);
  try { S.me = await withTimeout(rpc('admin_whoami'), 12000, 'ตรวจสิทธิ์แอดมิน'); } catch (e) {
    if (/นานเกิน|fetch|network|JWT|expired/i.test(String(e && e.message))) return failGate(e);
    return gate('หน้านี้สำหรับแอดมินเท่านั้น', 'บัญชี ' + esc(data.session.user.email) + ' ไม่มีสิทธิ์เข้าหลังบ้าน');
  }
  $('#who').textContent = (S.me.role === 'super' ? 'Super admin' : 'Support') + ' · ' + S.me.email;
  $('#app').hidden = false;
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
  $('#reload').onclick = () => { S.members = S.esp = null; render(); };
  const h = location.hash.slice(1); go(['ov','mem','esp','ota','log'].includes(h) ? h : 'ov');
  loadCounts();
}
function gate(t, msg, login) { const g = $('#gate'); g.hidden = false; g.innerHTML = `<h2 style="margin-top:0">${t}</h2><p class="note" style="font-size:14px">${msg}</p>` + (login ? '<a class="btn y" style="display:inline-flex;align-items:center;text-decoration:none" href="/">ไปหน้าเข้าสู่ระบบ</a>' : ''); }
async function loadCounts() { try { [S.members, S.esp] = await Promise.all([rpc('admin_members'), rpc('admin_esp32')]); $('#cMem').textContent = S.members.length; $('#cEsp').textContent = S.esp.length; if (S.tab === 'mem' || S.tab === 'esp') render(); } catch (e) { toast(thErr(e), 1); } }
function go(tab) { S.tab = tab; S.q = ''; history.replaceState(null, '', '#' + tab); document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab)); render(); }
const skel = n => '<div class="list">' + '<div class="sk"></div>'.repeat(n) + '</div>';

      v.innerHTML = '<div class="tiles">' + t('สมาชิก', o.users, 'ใช้งานใน 7 วัน ' + o.users_7d) + t('บอร์ด BATTLAB ออนไลน์', o.boards_online + ' / ' + o.boards, o.boards_unpaired ? 'ยังไม่จับคู่ ' + o.boards_unpaired : 'จับคู่ครบ') +

        '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 8px;font-size:14px;color:var(--muted)">เฟิร์มแวร์บอร์ด BATTLAB</h3><div class="act">' + Object.entries(o.fw || {}).sort().map(([k, n]) => `<span class="chip num" style="cursor:default">${esc(k)} · ${n}</span>`).join('') + '</div></div>';
    } catch (e) { v.innerHTML = `<div class="card empty">${esc(thErr(e))}</div>`; }

// ---------- bulk firmware update
const FW_BASE = 'https://nakon1122.github.io/battlab-cloud/';   // boards on v2.9.2 and older accept firmware only from this address
const OTA_T = { s3: {n:'บอร์ด ESP32-S3 (BMS)', match: d => d.kind === 'board' && /-s3$/.test(d.fw || '')},
               cyd35: {n:'บอร์ดจอ CYD 3.5" (BMS)', match: d => d.kind === 'board' && /-cyd35$/.test(d.fw || '')},
               cloudscreen: {n:'จอ Cloud Screen', match: d => d.kind === 'screen'} };
const verNum = v => (String(v || '').match(/(\d+)\.(\d+)\.(\d+)/) || [0, 0, 0, 0]).slice(1).reduce((a, x) => a * 1000 + +x, 0);
async function renderOta(v) {
  if (!isSuper()) { v.innerHTML = '<div class="card empty">สั่งอัปเดตเฟิร์มแวร์ได้เฉพาะ Super admin</div>'; return; }
  v.innerHTML = skel(4);
  try { if (!S.esp) S.esp = await rpc('admin_esp32'); if (!S.man) S.man = await (await fetch(FW_BASE + 'fw/manifest.json', {cache: 'no-store'})).json(); }
  catch (e) { v.innerHTML = `<div class="card empty">โหลดรายการเฟิร์มแวร์ไม่สำเร็จ: ${esc(thErr(e))}</div>`; return; }
  S.otaT = S.otaT || 's3';
  const vers = t => { const seen = new Set(), out = []; const add = (url, note) => { if (!url || seen.has(url)) return; seen.add(url); const ver = (url.match(/fw\/([0-9.]+)\//) || [])[1] || '?'; out.push({url, ver, note}); };
    add(S.man.boards?.[t]?.url, 'ล่าสุด'); (S.man.history || []).forEach(h => add(h.boards?.[t]?.app, h.date)); return out.sort((a, b) => verNum(b.ver) - verNum(a.ver)); };
  const list = vers(S.otaT); if (!S.otaUrl || !list.some(x => x.url === S.otaUrl)) S.otaUrl = list[0]?.url;
  const target = list.find(x => x.url === S.otaUrl);
  const devs = S.esp.filter(OTA_T[S.otaT].match);
  v.innerHTML = `<div class="steps">
      <label class="field card">1. ประเภทบอร์ด<select id="otaT">${Object.entries(OTA_T).map(([k, o]) => `<option value="${k}"${k === S.otaT ? ' selected' : ''}>${o.n} (${S.esp.filter(o.match).length})</option>`).join('')}</select></label>
      <label class="field card">2. เวอร์ชันที่จะติดตั้ง<select id="otaV">${list.map(x => `<option value="${esc(x.url)}"${x.url === S.otaUrl ? ' selected' : ''}>${esc(x.ver)}${x.note ? ' · ' + esc(x.note) : ''}</option>`).join('')}</select></label>
      <div class="card"><div class="note" style="font-size:13px">3. เลือกเครื่อง แล้วกดอัปเดต</div><div class="act" style="margin-top:8px"><button class="btn" type="button" id="otaAllOn">เลือกที่ออนไลน์ทั้งหมด</button><button class="btn" type="button" id="otaNone">ล้าง</button></div></div></div>
    <div class="list" id="otaList">${devs.length ? devs.map(d => { const same = verNum(d.fw) === verNum(target?.ver);
      return `<div class="otaRow"><input type="checkbox" id="o_${d.id}" data-o="${d.id}" data-k="${d.kind}" data-on="${d.online ? 1 : 0}"${same ? ' data-same="1"' : ''}><label for="o_${d.id}">${icon(d.kind)}<span class="main" style="flex:1;min-width:0"><span class="t" style="display:block;font-weight:600">${esc(d.name || '(ไม่มีชื่อ)')}</span><span class="m" style="display:block;font-size:12px;color:var(--muted)"><span class="dot ${d.online ? 'on' : ''}"></span>${d.online ? 'ออนไลน์' : 'ออฟไลน์ · ' + ago(d.last)} · ${esc(d.email || 'ยังไม่จับคู่')}</span></span></label><span class="num" style="font-size:13px">${esc(d.fw || '?')}</span><span class="st" id="s_${d.id}">${same ? 'เวอร์ชันนี้อยู่แล้ว' : 'พร้อม'}</span></div>`; }).join('') : '<div class="card empty">ไม่มีเครื่องประเภทนี้</div>'}</div>
    <div class="card" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center"><span class="note" style="flex:1 1 260px;font-size:13px">บอร์ดจะดาวน์โหลดเฟิร์มแวร์เองแล้วรีสตาร์ต (ประมาณ 1–2 นาที) · เครื่องที่ออฟไลน์จะอัปเดตเมื่อกลับมาออนไลน์ภายใน 3 นาทีถัดไปเท่านั้น · ค่าที่ตั้งไว้ในบอร์ดไม่หาย · <b>โมดูล VOLTOL</b> ยังสั่งอัปเดตจากคลาวด์ไม่ได้ ใช้หน้าเฟิร์มแวร์บนโมดูลแทน</span><button class="btn y" type="button" id="otaGo" disabled>อัปเดต 0 เครื่อง</button></div>`;
  const boxes = () => [...document.querySelectorAll('[data-o]')], picked = () => boxes().filter(b => b.checked);
  const sync = () => { const n = picked().length; $('#otaGo').disabled = !n; $('#otaGo').textContent = `อัปเดต ${n} เครื่อง เป็น ${target?.ver || ''}`; };
  boxes().forEach(b => b.onchange = sync);
  $('#otaT').onchange = e => { S.otaT = e.target.value; S.otaUrl = null; renderOta(v); };
  $('#otaV').onchange = e => { S.otaUrl = e.target.value; renderOta(v); };
  $('#otaAllOn').onclick = () => { boxes().forEach(b => b.checked = b.dataset.on === '1' && !b.dataset.same); sync(); };
  $('#otaNone').onclick = () => { boxes().forEach(b => b.checked = false); sync(); };
  $('#otaGo').onclick = () => {
    const sel = picked(); if (!sel.length || !target) return;
    const off = sel.filter(b => b.dataset.on !== '1').length;
    const c = document.createElement('div'); c.className = 'confirm';
    c.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="cfT"><h2 id="cfT" style="margin:0 0 8px;font:700 20px 'Chakra Petch'">อัปเดต ${sel.length} เครื่อง เป็น ${esc(target.ver)}?</h2><p class="note" style="font-size:14px">${OTA_T[S.otaT].n}${off ? ` · ในนี้ออฟไลน์ ${off} เครื่อง` : ''}<br>ระหว่างอัปเดตบอร์ดจะหยุดส่งข้อมูลชั่วคราว ห้ามถอดไฟ</p><div class="act" style="justify-content:flex-end"><button class="btn" type="button" id="cfNo">ยกเลิก</button><button class="btn y" type="button" id="cfYes">ยืนยันอัปเดต</button></div></div>`;
    document.body.append(c); $('#cfNo').focus();
    $('#cfNo').onclick = () => c.remove();
    $('#cfYes').onclick = async () => { c.remove(); $('#otaGo').disabled = true;
      const items = sel.map(b => ({id: b.dataset.o, kind: b.dataset.k, url: FW_BASE + target.url}));
      let res; try { res = await rpc('admin_bulk_ota', {p_items: items}); } catch (e) { toast(thErr(e), 1); sync(); return; }
      res.forEach(r => { const el = document.getElementById('s_' + r.id); if (el) { el.className = 'st ' + (r.ok ? 'run' : 'err'); el.textContent = r.ok ? 'ส่งคำสั่งแล้ว' : 'ไม่สำเร็จ: ' + thErr({message: r.error}); } });
      toast('ส่งคำสั่งอัปเดต ' + res.filter(r => r.ok).length + ' เครื่อง');
      pollOta(res.filter(r => r.ok).map(r => r.id), target.ver);
    };
  };
  sync();
}
function pollOta(ids, ver) {
  if (!ids.length) return; let n = 0;
  const tick = async () => { n++;
    try { const st = await rpc('admin_ota_status', {p_ids: ids});
      st.forEach(x => { const el = document.getElementById('s_' + x.id); if (!el) return;
        let cls = 'run', t = 'รอบอร์ดรับคำสั่ง';
        const res = x.result == null ? '' : String(typeof x.result === 'string' ? x.result : (x.result.msg || JSON.stringify(x.result)));
        if (verNum(x.fw) === verNum(ver)) { cls = 'ok'; t = '✓ เป็น ' + ver + ' แล้ว'; }
        else if (x.status === 'error' || x.status === 'expired') { cls = 'err'; t = x.status === 'expired' ? 'บอร์ดไม่ได้ออนไลน์ คำสั่งหมดอายุ' : 'ไม่สำเร็จ: ' + res.slice(0, 60); }
        else if (x.status === 'done' && /not allowed|unknown|only/i.test(res)) { cls = 'err'; t = 'บอร์ดปฏิเสธ: ' + res.slice(0, 60); }
        else if (x.status === 'done') { t = 'กำลังดาวน์โหลด/รีสตาร์ต'; }
        else if (x.status === 'queued') { t = 'รอจอรับคำสั่ง'; }
        el.className = 'st ' + cls; el.textContent = t; }); } catch {}
    if (n < 45 && S.tab === 'ota') setTimeout(tick, 4000); else { S.esp = null; }
  };
  setTimeout(tick, 3000);
}

async function openMember(id) {
  openDrawer(skel(3));
  let m; try { m = await rpc('admin_member', {p_user: id}); } catch (e) { $('#panel').insertAdjacentHTML('beforeend', `<p>${esc(thErr(e))}</p>`); return; }
  const self = id === S.me.id, sup = isSuper();
  openDrawer(`<h2 id="dTitle">${esc(m.email)}</h2>
    <div style="margin-top:6px">${m.role ? `<span class="badge b-${m.role}" style="margin:0">${m.role === 'super' ? 'Super admin' : 'Support'}</span>` : ''}${m.banned ? '<span class="badge b-ban">ถูกระงับ</span>' : ''}${m.confirmed ? '' : '<span class="badge b-unc">ยังไม่ยืนยันอีเมล</span>'}</div>
    <dl class="kv"><dt>สมัครเมื่อ</dt><dd>${dt(m.created)}</dd><dt>เข้าระบบล่าสุด</dt><dd>${dt(m.last_login)} (${ago(m.last_login)})</dd><dt>LuxPower</dt><dd>${esc(m.lux || 'ไม่ได้เชื่อม')}</dd><dt>ลิงก์แชร์</dt><dd>${m.shares}</dd><dt>รหัสบัญชี</dt><dd class="num" style="font-size:12px">${esc(m.id)}</dd></dl>
    <div class="sec"><h3>อุปกรณ์ของบัญชีนี้ (${m.devices.length})</h3><div class="list">${m.devices.length ? m.devices.map(d => `<button type="button" class="row" data-d="${d.id}">${icon(d.kind)}<span class="main"><span class="t">${esc(d.name || '(ไม่มีชื่อ)')}</span><span class="m"><span class="dot ${d.online ? 'on' : ''}"></span>${d.online ? 'ออนไลน์' : ago(d.last)} · ${KIND[d.kind].n}</span></span></button>`).join('') : '<div class="note">ยังไม่มีอุปกรณ์</div>'}</div></div>
    <div class="sec"><h3>รหัสผ่านและอีเมล</h3><div class="act"><label class="field">รหัสผ่านใหม่ (8 ตัวขึ้นไป)<input id="pw" type="text" autocomplete="new-password" minlength="8"></label><button class="btn" type="button" id="pwGen">สุ่ม</button><button class="btn y" type="button" id="pwSet">ตั้งรหัสผ่าน</button></div>
      ${m.confirmed ? '' : '<div class="act" style="margin-top:8px"><button class="btn" type="button" id="conf">ยืนยันอีเมลให้</button></div>'}<p class="note">ตั้งรหัสแล้วแจ้งลูกค้าทางช่องทางอื่น ระบบไม่ส่งอีเมลให้</p></div>
    ${sup ? `<div class="sec"><h3>สิทธิ์หลังบ้าน</h3><div class="act"><label class="field">สิทธิ์<select id="role"><option value="">สมาชิกทั่วไป</option><option value="support"${m.role === 'support' ? ' selected' : ''}>Support (ดู/แก้ข้อมูลลูกค้า)</option><option value="super"${m.role === 'super' ? ' selected' : ''}>Super admin (ทำได้ทุกอย่าง)</option></select></label><button class="btn y" type="button" id="roleSet"${self ? ' disabled' : ''}>บันทึกสิทธิ์</button></div></div>
    <div class="sec"><h3>การเข้าใช้งาน</h3><div class="act"><button class="btn ${m.banned ? 'y' : 'red'}" type="button" id="ban"${self ? ' disabled' : ''}>${m.banned ? 'เปิดบัญชีคืน' : 'ระงับบัญชี (ล็อกอินไม่ได้)'}</button></div><p class="note">ระงับแล้วจะออกจากระบบทุกเครื่องทันที อุปกรณ์ยังส่งข้อมูลเข้าบัญชีตามปกติ</p></div>
    <div class="sec"><h3 style="color:var(--bad)">ลบบัญชี</h3><p class="note">บอร์ด BATTLAB และจอจะถูกปลดออก (ข้อมูลยังอยู่ จับคู่ใหม่ได้) · ถ้ามีโมดูล VOLTOL ต้องย้ายไปบัญชีอื่นก่อน · ย้อนกลับไม่ได้</p><div class="act"><label class="field">พิมพ์อีเมลนี้เพื่อยืนยัน<input id="delConf" type="text" autocomplete="off"></label><button class="btn red" type="button" id="del"${self ? ' disabled' : ''}>ลบบัญชีถาวร</button></div></div>` : '<p class="note sec">การตั้งสิทธิ์ ระงับ และลบบัญชี ทำได้เฉพาะ Super admin</p>'}`);
  document.querySelectorAll('#panel [data-d]').forEach(r => r.onclick = () => openDevice(r.dataset.d));
  $('#pwGen').onclick = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; const r = crypto.getRandomValues(new Uint32Array(12)); $('#pw').value = [...r].map(x => a[x % a.length]).join(''); };
  $('#pwSet').onclick = e => act(e.target, () => rpc('admin_set_password', {p_user: id, p_password: $('#pw').value}), 'ตั้งรหัสผ่านใหม่แล้ว');
  if ($('#conf')) $('#conf').onclick = e => act(e.target, () => rpc('admin_confirm_user', {p_user: id}), 'ยืนยันอีเมลแล้ว', () => { refresh(); openMember(id); });
  if (!sup) return;
  $('#roleSet').onclick = e => act(e.target, () => rpc('admin_set_role', {p_email: m.email, p_role: $('#role').value || null}), 'บันทึกสิทธิ์แล้ว', () => { refresh(); openMember(id); });
  $('#ban').onclick = e => act(e.target, () => rpc('admin_ban_user', {p_user: id, p_ban: !m.banned}), m.banned ? 'เปิดบัญชีคืนแล้ว' : 'ระงับบัญชีแล้ว', () => { refresh(); openMember(id); });
  $('#del').onclick = e => act(e.target, () => rpc('admin_delete_user', {p_user: id, p_confirm_email: $('#delConf').value}), 'ลบบัญชีแล้ว', () => { closeDrawer(); refresh(); });
}

async function openDevice(id) {
  if (!S.esp) S.esp = await rpc('admin_esp32');
  let d = S.esp.find(x => x.id === id); if (!d) { S.esp = await rpc('admin_esp32'); d = S.esp.find(x => x.id === id); }
  if (!d) return toast('ไม่พบอุปกรณ์', 1);
  const sup = isSuper(), k = d.kind, canRelease = k === 'board' || k === 'inverter' || k === 'screen';
  const rows = [['ประเภท', KIND[k].n], ['สถานะ', `<span class="dot ${d.online ? 'on' : ''}"></span>${d.online ? 'ออนไลน์' : 'ออฟไลน์'} · ส่งข้อมูลล่าสุด ${dt(d.last)}`], ['เจ้าของ', esc(d.email || 'ยังไม่จับคู่')],
    ['เฟิร์มแวร์', esc(d.fw || '—')], d.board ? ['บอร์ด', esc(d.board)] : null, d.pair ? ['รหัสจับคู่', `<span class="num">${esc(d.pair)}</span>`] : null,
    d.ip ? ['เครือข่าย', esc((d.ssid || '') + ' · ' + d.ip + (d.rssi != null ? ' · ' + d.rssi + ' dBm' : ''))] : null, d.soc != null ? ['SOC', d.soc + '%'] : null,
    d.rows_24h != null ? ['ข้อมูล 24 ชม.', d.rows_24h + ' แถว'] : null, d.label ? ['ชื่อจากบอร์ด', esc(d.label)] : null, ['เพิ่มเข้าระบบ', dt(d.created)], ['รหัสอุปกรณ์', `<span class="num" style="font-size:12px">${esc(d.id)}</span>`]].filter(Boolean);
  openDrawer(`<div style="display:flex;gap:12px;align-items:center">${icon(k)}<h2 id="dTitle">${esc(d.name || '(ไม่มีชื่อ)')}</h2></div>
    <dl class="kv">${rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
    <div class="sec"><h3>ชื่อที่แสดง</h3><div class="act"><label class="field">ชื่อ<input id="nm" value="${esc(d.name || '')}" maxlength="60"></label><button class="btn y" type="button" id="nmSet">บันทึกชื่อ</button></div></div>
    <div class="sec"><h3>ย้ายไปบัญชีอื่น</h3><div class="act"><label class="field">อีเมลเจ้าของใหม่<input id="ow" type="email" list="mails" autocomplete="off"></label><datalist id="mails">${(S.members || []).map(m => `<option value="${esc(m.email)}">`).join('')}</datalist><button class="btn y" type="button" id="owSet">ย้าย</button>${canRelease && d.owner ? '<button class="btn" type="button" id="rel">ปลดออกจากบัญชี</button>' : ''}</div><p class="note">${k === 'board' ? 'ย้าย/ปลดแล้วลิงก์แชร์ของบอร์ดนี้จะถูกลบ' : k === 'voltol' ? 'โมดูลยังส่งข้อมูลต่อตามปกติ แค่ไปแสดงในบัญชีใหม่' : 'จอจะแสดงแบตของบัญชีใหม่'}</p></div>
    ${k === 'board' ? `<div class="sec"><h3>สั่งงานบอร์ด</h3><div class="act"><button class="btn" type="button" data-cmd="ping">ทดสอบการเชื่อมต่อ</button><button class="btn" type="button" data-cmd="bms_read">อ่านค่า BMS ใหม่</button><button class="btn red" type="button" data-cmd="restart">รีสตาร์ตบอร์ด</button></div><p class="note">บอร์ดรับคำสั่งในรอบส่งข้อมูลถัดไป (ไม่กี่วินาที)</p></div>` : ''}
    ${k === 'board' || k === 'inverter' ? '<div class="sec"><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="https://batterycloud.battlab.net/#admin/dev" target="_blank" rel="noopener">เปิดรายละเอียดเต็มใน Battery Cloud ↗</a></div>' : ''}
    ${sup && k !== 'screen' ? `<div class="sec"><h3 style="color:var(--bad)">ลบอุปกรณ์</h3><p class="note">${k === 'voltol' ? 'ลบโมดูลและข้อมูลวิ่งทั้งหมด บอร์ดจะส่งข้อมูลไม่ได้จนกว่าจะลงทะเบียนใหม่' : 'ลบอุปกรณ์และประวัติทั้งหมด บอร์ดที่ยังออนไลน์จะลงทะเบียนตัวเองใหม่เป็นอุปกรณ์ที่ยังไม่จับคู่'} · ย้อนกลับไม่ได้</p><div class="act"><label class="field">พิมพ์ชื่ออุปกรณ์เพื่อยืนยัน<input id="delConf" autocomplete="off"></label><button class="btn red" type="button" id="del">ลบถาวร</button></div></div>` : ''}`);
  const back = () => refresh().then(() => openDevice(id));
  $('#nmSet').onclick = e => act(e.target, () => k === 'voltol' ? rpc('admin_voltol_rename', {p_id: id, p_name: $('#nm').value}) : k === 'screen' ? rpc('admin_set_viewer', {p_id: id, p_name: $('#nm').value, p_eco: d.eco ?? -1, p_release: false}) : rpc('admin_update_device', {p_id: id, p_name: $('#nm').value, p_settings: null}), 'บันทึกชื่อแล้ว', back);
  $('#owSet').onclick = e => { const em = $('#ow').value.trim(); if (!em) return toast('กรอกอีเมลเจ้าของใหม่', 1);
    act(e.target, () => k === 'voltol' ? rpc('admin_voltol_set_owner', {p_id: id, p_email: em}) : k === 'screen' ? rpc('admin_viewer_set_owner', {p_id: id, p_email: em}) : rpc('admin_set_owner', {p_id: id, p_email: em}), 'ย้ายเจ้าของแล้ว', back); };
  if ($('#rel')) $('#rel').onclick = e => act(e.target, () => k === 'screen' ? rpc('admin_viewer_set_owner', {p_id: id, p_email: null}) : rpc('admin_set_owner', {p_id: id, p_email: null}), 'ปลดออกจากบัญชีแล้ว', back);
  document.querySelectorAll('#panel [data-cmd]').forEach(b => b.onclick = () => act(b, () => rpc('admin_send_command', {p_device: id, p_cmd: b.dataset.cmd, p_args: {}}), 'ส่งคำสั่งแล้ว'));
  if ($('#del')) $('#del').onclick = e => act(e.target, () => k === 'voltol' ? rpc('admin_voltol_delete', {p_id: id, p_confirm_name: $('#delConf').value}) : rpc('admin_device_delete', {p_id: id, p_confirm_name: $('#delConf').value}), 'ลบแล้ว', () => { closeDrawer(); refresh(); });
}
boot().catch(failGate);
</script>
</body>
</html>
